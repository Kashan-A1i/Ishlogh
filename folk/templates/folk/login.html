{% extends "folk/master.html" %}
{% load static %}
{% block body %}
<link rel="stylesheet" href="{% static 'folk/login.css' %}">
<div class="box-container">
    <div class="box">
        <h2 class="story-title">Welcome back!</h2>
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="login">Log In</button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>
        <p>
            Don't have an account? <a id= "signup" href="#">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}
